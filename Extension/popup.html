<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VeloDrop</title>
<link rel="stylesheet" href="popup.css">
<header>
  <img src="Icon48.png" alt="" width="38" height="38">
  <div>
    <h1>VeloDrop</h1>
    <p id="status" role="status" data-message="checkingConnection"></p>
  </div>
</header>
<main>
  <p class="lede" data-message="bridgeOnly"></p>
  <div id="summary" class="summary" hidden>
    <span id="takeover"></span>
    <span id="minimum"></span>
    <span id="excluded"></span>
  </div>
  <p class="hint" data-message="bridgeHint"></p>
  <button id="open" type="button" data-message="openVeloDrop" disabled></button>
</main>
<footer>
  <span id="version"></span>
  <span data-message="settingsManaged"></span>
</footer>
<script type="module" src="popup.js"></script>
</html>
