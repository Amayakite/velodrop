<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VeloDrop</title>
<link rel="stylesheet" href="popup.css">
<header>
  <img src="Icon48.png" alt="" width="36" height="36">
  <div><h1>VeloDrop</h1><p id="status" role="status">Checking connection…</p></div>
</header>
<main>
  <label class="switch"><span>Automatically take over downloads</span><input id="enabled" type="checkbox"></label>
  <label for="minimum">Minimum file size</label>
  <div class="number"><input id="minimum" type="number" min="0" max="10240" step="1"><span>MiB</span></div>
  <label for="hosts">Keep these sites in Edge</label>
  <textarea id="hosts" rows="2" placeholder="example.com" spellcheck="false"></textarea>
  <p class="hint">One domain per line. Set the minimum to zero to include small files.</p>
</main>
<script type="module" src="popup.js"></script>
</html>
