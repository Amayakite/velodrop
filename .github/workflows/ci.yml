name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build and verify
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Show toolchain
        run: |
          sw_vers
          uname -m
          swift --version
          node --version

      - name: Build release
        run: swift build -c release

      - name: Run core checks
        run: swift run -c release VeloCoreChecks

      - name: Validate localizations
        run: plutil -lint Resources/zh-Hans.lproj/Localizable.strings

      - name: Check extension JavaScript
        run: |
          for file in Extension/*.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Check shell scripts
        run: |
          for file in Scripts/*.sh; do bash -n "$file"; done
          for file in Scripts/*.mjs; do node --check "$file"; done

  package:
    name: Package and test browsers
    runs-on: macos-15
    needs: verify
    env:
      VELODROP_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Read version
        id: version
        run: |
          version="$(plutil -extract version raw -o - Extension/manifest.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache aria2 build
        uses: actions/cache@v6
        with:
          path: .build/engine-*
          key: aria2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Scripts/build-engine.sh', 'Scripts/aria2-scoped-headers.patch') }}

      - name: Build DMG
        run: Scripts/package.sh .dist

      - name: Verify terminal command
        run: node Scripts/cli-smoke.mjs .dist/VeloDrop.app

      - name: Verify Chrome, Edge, and Firefox
        run: bash Scripts/browser-checks.sh .dist/VeloDrop.app

      - name: Verify DMG
        run: |
          set -euo pipefail
          dmg="$(find .dist -maxdepth 1 -name 'VeloDrop-*-macos-*.dmg' -print -quit)"
          test -n "$dmg"
          hdiutil verify "$dmg"
          codesign --verify --deep --strict .dist/VeloDrop.app
          codesign --verify --deep --strict ".dist/Install VeloDrop.app"
          mount="$(mktemp -d)"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount" >/dev/null
          test -d "$mount/Install VeloDrop.app"
          test -x "$mount/Install VeloDrop.app/Contents/MacOS/VeloDropInstaller"
          test -d "$mount/Install VeloDrop.app/Contents/Resources/Payload/VeloDrop.app"
          hdiutil detach "$mount" -quiet
          rmdir "$mount"
          ( cd .dist && shasum -a 256 "$(basename "$dmg")" > SHA256SUMS.txt )
          cat .dist/SHA256SUMS.txt

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: VeloDrop-${{ steps.version.outputs.version }}-build-${{ github.run_number }}
          path: |
            .dist/*.dmg
            .dist/SHA256SUMS.txt
          include-hidden-files: true
          retention-days: 14
