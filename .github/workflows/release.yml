name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v0.5.0"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Package and publish DMG
    runs-on: macos-15
    env:
      VELODROP_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Show toolchain
        run: |
          sw_vers
          uname -m
          swift --version
          node --version

      - name: Resolve and validate version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          case "$tag" in
            v*) ;;
            *) echo "Release requires a v* tag, got: $tag" >&2; exit 1 ;;
          esac
          version="${tag#v}"
          manifest="$(plutil -extract version raw -o - Extension/manifest.json)"
          if [ "$version" != "$manifest" ]; then
            echo "Tag $tag does not match Extension/manifest.json version $manifest" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate sources
        run: |
          swift build -c release
          swift run -c release VeloCoreChecks
          plutil -lint Resources/zh-Hans.lproj/Localizable.strings
          for file in Extension/*.js; do node --check "$file"; done
          for file in Scripts/*.sh; do bash -n "$file"; done
          for file in Scripts/*.mjs; do node --check "$file"; done

      - name: Cache aria2 build
        uses: actions/cache@v6
        with:
          path: .build/engine-*
          key: aria2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Scripts/build-engine.sh', 'Scripts/aria2-scoped-headers.patch') }}

      - name: Build DMG
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          signed="$RUNNER_TEMP/VeloDrop-Firefox.xpi"
          if gh release download "$RELEASE_TAG" --pattern VeloDrop-Firefox.xpi --output "$signed" 2>/dev/null; then
            export VELODROP_FIREFOX_XPI="$signed"
          fi
          Scripts/package.sh .dist

      - name: Verify terminal command
        run: node Scripts/cli-smoke.mjs .dist/VeloDrop.app

      - name: Verify Chrome, Edge, and Firefox
        run: bash Scripts/browser-checks.sh .dist/VeloDrop.app

      - name: Verify DMG and write checksum
        run: |
          set -euo pipefail
          dmg="$(find .dist -maxdepth 1 -name 'VeloDrop-*-macos-*.dmg' -print -quit)"
          test -n "$dmg"
          hdiutil verify "$dmg"
          codesign --verify --deep --strict .dist/VeloDrop.app
          codesign --verify --deep --strict ".dist/Install VeloDrop.app"
          mount="$(mktemp -d)"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount" >/dev/null
          test -d "$mount/Install VeloDrop.app"
          test -x "$mount/Install VeloDrop.app/Contents/MacOS/VeloDropInstaller"
          test -d "$mount/Install VeloDrop.app/Contents/Resources/Payload/VeloDrop.app"
          hdiutil detach "$mount" -quiet
          rmdir "$mount"
          ( cd .dist && shasum -a 256 "$(basename "$dmg")" > SHA256SUMS.txt )
          cat .dist/SHA256SUMS.txt

      - name: Prepare release notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf 'VeloDrop %s\n' "$version" > release-notes.md
          fi
          cat >> release-notes.md <<'EOF'

          ---

          - **安装**：下载 `VeloDrop-VERSION-macos-arm64.dmg`，打开后双击「Install VeloDrop」。安装器会退出正在运行的旧版本、替换「应用程序」中的应用并重新打开。
          - **要求**：Apple 芯片，macOS 14 或更新版本。
          - **签名**：ad-hoc 签名，尚未经过 Apple 公证；首次打开如被系统拦截，请在 Finder 中右键「Install VeloDrop.app」选择「打开」。
          - **升级**：直接再次运行安装器即可。若浏览器仍显示旧版扩展，请在该浏览器的扩展管理页重新加载 VeloDrop。
          EOF
          sed -i '' "s/VERSION/$version/g" release-notes.md
          if [ -f .dist/VeloDrop-Firefox.xpi ]; then
            printf '\n- **Firefox**：设置的「浏览器」页可以打开随包提供的已签名扩展。\n' >> release-notes.md
          else
            printf '\n- **Firefox**：设置的「浏览器」页提供临时载入入口，重启 Firefox 后需重新载入。\n' >> release-notes.md
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: VeloDrop-${{ steps.version.outputs.version }}-release
          path: |
            .dist/*.dmg
            .dist/SHA256SUMS.txt
            .dist/VeloDrop-Firefox.xpi
          include-hidden-files: true
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          command -v gh >/dev/null || brew install gh
          tag="$RELEASE_TAG"
          version="$RELEASE_VERSION"
          assets=(.dist/*.dmg .dist/SHA256SUMS.txt)
          if [ -f .dist/VeloDrop-Firefox.xpi ]; then assets+=(.dist/VeloDrop-Firefox.xpi); fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --title "VeloDrop $version" --notes-file release-notes.md
          else
            gh release create "$tag" "${assets[@]}" \
              --verify-tag --title "VeloDrop $version" \
              --notes-file release-notes.md --latest
          fi
